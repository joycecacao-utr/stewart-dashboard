name: Diag Sentiment (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run sentiment diagnostic
        env:
          FRESHDESK_KEY:           ${{ secrets.FRESHDESK_KEY }}
          VOICEFLOW_KEY:           ${{ secrets.VOICEFLOW_KEY }}
          GOOGLE_SHEETS_API_KEY:   ${{ secrets.GOOGLE_SHEETS_API_KEY }}
          FRESHDESK_DOMAIN:        universaltennis
          CURRENT_MONTH_ONLY:      '1'
          DIAG_SENTIMENT:          '1'
        run: node fetch-css-data.js
